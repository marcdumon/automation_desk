# CLAUDE> Non-secret settings only. The OpenRouter key comes from .env.

[llm]
base_url = 'https://openrouter.ai/api/v1'
# CLAUDE> Verified 2026-09-24 in openrouter.ai/api/v1/models: supports structured_outputs, $0.10 in / $0.50 out per M tokens.
# On the same 60 news articles it cost 60% less than google/gemini-3.1-flash-lite, with summaries as good (3x slower).
model = 'openai/gpt-6-luna'

[time]
# CLAUDE> used only when the Calendar settings cannot be read
fallback_timezone = 'Europe/Brussels'

[web]
max_pages = 5

[server]
# CLAUDE> 8000 is taken by fin_research
port = 8765

[prices]
# CLAUDE> dollars per million tokens of the configured model, checked on openrouter.ai; used to estimate a batch before sending it
input_per_m = 0.10
output_per_m = 0.50

[news]
cap_usd = 0.30
max_words = 500
batch_size = 20
