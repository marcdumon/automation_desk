# Non-secret settings only. The OpenRouter key comes from .env.

[llm]
base_url = 'https://openrouter.ai/api/v1'
# Verified 2026-09-24 in openrouter.ai/api/v1/models: supports structured_outputs, $0.10 in / $0.50 out per M tokens.
# On the same 60 news articles it cost 60% less than google/gemini-3.1-flash-lite, with summaries as good (3x slower).
model = 'openai/gpt-6-luna'
# OpenRouter allows new accounts 20 requests a minute per model; calls are spaced to stay under it
requests_per_minute = 20

[time]
# used only when the Calendar settings cannot be read
fallback_timezone = 'Europe/Brussels'

[web]
max_pages = 5

[server]
# 8000 is taken by fin_research
port = 8765

[prices]
# dollars per million tokens of the configured model, checked on openrouter.ai; used to estimate a batch before sending it
input_per_m = 0.10
output_per_m = 0.50

[news]
cap_usd = 0.30
# words of the site's teaser shown under a title; without a teaser only the title shows
max_words = 60
# headlines per model call; the model only sorts them into subjects
batch_size = 60

[polar]
# the Polar Sensor Logger files (phone) and the sessions of the logger on the PC, read only on Import sessions; the
# logger's project folder, where Start recording runs it
phone_dir = '/path/to/polar_h10_logger/phone_sessions'
logger_dir = '/path/to/polar_h10_logger/pc_sessions'
logger_project = '/mnt/Dev/active_python_projects/polar_h10_logger'
# the folder of the Polar Sensor Logger files on the phone, through the phone app WiFi FTP Server: Import sessions first copies
# its new files to phone_dir; the password is POLAR_PHONE_FTP_PASSWORD in .env
phone_ftp = 'ftp://user@192.168.1.20:2221/Documents/Polar_hr_data/'

[sleep]
# the Sleep as Android backup: the phone's SleepCloud add-on writes it to Dropbox, the Dropbox app syncs it here; read only
# on Import sleep
backup_file = '/path/to/Dropbox/Apps/Sleep Cloud Backup/Sleep as Android Data.zip'
