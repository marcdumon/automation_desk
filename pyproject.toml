[project]
name = 'automation_desk'
version = '0.1.0'
description = 'Automate Google Calendar, Tasks and Gmail with plain sentences, organised as task groups of standard tasks'
requires-python = '>=3.13'
dependencies = [
    "beautifulsoup4>=4.15.0",
    "fastapi>=0.141.1",
    "feedparser>=6.0.14",
    "google-api-python-client>=2.200.0",
    "google-auth-oauthlib>=1.4.1",
    "httpx>=0.28.1",
    "icalendar>=7.3.0",
    "lxml>=6.1.3",
    "pydantic>=2.13.5",
    "pypdf>=6.19.0",
    "python-dotenv>=1.2.3",
    "uvicorn[standard]>=0.53.0",
]

[project.scripts]
automation-desk = 'automation_desk.api:main'

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "respx>=0.23.1",
    "ruff>=0.16.8",
]

[build-system]
requires = ['hatchling']
build-backend = 'hatchling.build'

[tool.hatch.build.targets.wheel]
packages = ['src/automation_desk']

[tool.pytest.ini_options]
testpaths = ['tests']
addopts = '-q --tb=short'

[tool.ruff]
line-length = 135

[tool.ruff.lint]
select = ['E', 'F', 'I', 'B', 'UP', 'SIM', 'RUF']

[tool.ruff.format]
quote-style = 'single'
