# Copy this file to automation_desk.toml (not in git) and set your own values. Non-secret settings only: the OpenRouter
# key comes from .env.

# the folder of the database, the uploads, the captures and the logs (put it where your backups are made); empty: the
# folder data in the app folder
# for example data_dir = '/path/to/backed_up/automation_desk'
data_dir = ''

[llm]
base_url = 'https://openrouter.ai/api/v1'
# Verified 2026-09-24 in openrouter.ai/api/v1/models: supports structured_outputs, $0.10 in / $0.50 out per M tokens.
# On the same 60 news articles it cost 60% less than google/gemini-3.1-flash-lite, with summaries as good (3x slower).
model = 'openai/gpt-6-luna'
# OpenRouter allows new accounts 20 requests a minute per model; calls are spaced to stay under it
requests_per_minute = 20

[time]
# used only when the Calendar settings cannot be read
fallback_timezone = 'Europe/Brussels'

[web]
max_pages = 5

[server]
# 8000 is taken by fin_research
port = 8765

[prices]
# dollars per million tokens of the configured model, checked on openrouter.ai; used to estimate a batch before sending it
input_per_m = 0.10
output_per_m = 0.50

[news]
cap_usd = 0.30
# words of the site's teaser shown under a title; without a teaser only the title shows
max_words = 60
# headlines per model call; the model only sorts them into subjects
batch_size = 60
